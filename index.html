<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>AI Audience Lab</title>
    <style>
      :root { color-scheme: dark; }
      body { margin: 0; font-family: Inter, Arial, sans-serif; background: #0b1020; color: #eef2ff; }
      main { max-width: 960px; margin: 0 auto; padding: 24px 16px 48px; }
      .panel { background: #131a33; border: 1px solid #243159; border-radius: 14px; padding: 16px; margin-top: 16px; }
      .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(170px, 1fr)); gap: 10px; }
      .card { background: #0f1630; border: 1px solid #273565; border-radius: 12px; padding: 12px; }
      textarea, input { width: 100%; margin-top: 8px; border-radius: 8px; border: 1px solid #2f3f75; background: #0f1630; color: #f5f7ff; padding: 10px; }
      textarea { min-height: 120px; }
      button { margin-top: 12px; background: #4f7cff; border: 0; color: white; font-weight: 700; border-radius: 10px; padding: 10px 14px; cursor: pointer; }
      ul { padding-left: 20px; }
      .muted { color: #b6c2ff; font-size: 14px; }
    </style>
  </head>
  <body>
    <main>
      <h1>AI Audience Lab</h1>
      <p>Ask AI directly, simulate 1000 target users, and preview FTD/NGR outcomes before real spend.</p>

      <section class="panel">
        <h2>Campaign simulation</h2>
        <label for="banner">Banner / offer copy</label>
        <textarea id="banner">100% Sports welcome bonus up to 200 EUR. Rollover 6x. Min odds 1.6. 30 days. Casino bonus up to 300 EUR with cashback and rakeback.</textarea>
        <button id="simulateBtn">Run 1000-person simulation</button>
      </section>

      <section class="panel">
        <h2>Chat with AI</h2>
        <input id="chatInput" value="Simulate this banner for 1000 personas" />
        <button id="chatBtn">Ask AI</button>
        <p id="chatReply" class="muted">I can simulate campaigns and forecast FTD/NGR.</p>
      </section>

      <section class="panel" id="report" hidden>
        <h2>Projected funnel (FTD + NGR)</h2>
        <div class="grid" id="funnelGrid"></div>
        <h3>Insights</h3>
        <ul id="insights"></ul>
        <h3>Next actions</h3>
        <ul id="nextActions"></ul>
      </section>
    </main>

    <script>
      const weights = {
        sports_first: 0.35,
        bonus_hunter: 0.25,
        casino_first: 0.2,
        trust_first: 0.1,
        mobile_fast: 0.1,
      };

      const base = {
        sports_first: { click: 0.2, signup: 0.38, ftd: 0.43, ngrPerFtd: 54 },
        bonus_hunter: { click: 0.24, signup: 0.34, ftd: 0.31, ngrPerFtd: 39 },
        casino_first: { click: 0.19, signup: 0.41, ftd: 0.45, ngrPerFtd: 62 },
        trust_first: { click: 0.14, signup: 0.44, ftd: 0.52, ngrPerFtd: 58 },
        mobile_fast: { click: 0.23, signup: 0.31, ftd: 0.29, ngrPerFtd: 35 },
      };

      function multipliers(msg) {
        const lower = msg.toLowerCase();
        let clickBoost = 1;
        let signupBoost = 1;
        let ftdBoost = 1;
        if (lower.includes('100%') || lower.includes('welcome')) clickBoost += 0.06;
        if (lower.includes('6x') || lower.includes('min') || lower.includes('terms')) signupBoost += 0.04;
        if (lower.includes('cashback') || lower.includes('rakeback')) ftdBoost += 0.05;
        if (lower.length > 500) clickBoost -= 0.04;
        return { clickBoost, signupBoost, ftdBoost };
      }

      function simulate(adMessage, personas = 1000) {
        const m = multipliers(adMessage);
        let clicks = 0, signups = 0, ftd = 0, ngr = 0;

        Object.keys(weights).forEach((segment) => {
          const pop = Math.round(personas * weights[segment]);
          const r = base[segment];
          const sClicks = Math.round(pop * r.click * m.clickBoost);
          const sSignups = Math.round(sClicks * r.signup * m.signupBoost);
          const sFtd = Math.round(sSignups * r.ftd * m.ftdBoost);
          clicks += sClicks;
          signups += sSignups;
          ftd += sFtd;
          ngr += sFtd * r.ngrPerFtd;
        });

        return {
          funnel: {
            impressions: personas,
            clicks,
            signups,
            firstTimeDepositors: ftd,
            ngrEstimateEur: ngr,
            ctr: +(clicks / personas).toFixed(3),
            signupRateFromClick: +(signups / Math.max(clicks, 1)).toFixed(3),
            ftdRateFromSignup: +(ftd / Math.max(signups, 1)).toFixed(3),
          },
          insights: [
            'Strongest response is usually from bonus-focused and mobile-fast segments when immediate value is clear.',
            'Trust-first users convert better when rollover/min-odds terms are explicit.',
            'Split Sports and Casino messages to reduce top-of-funnel friction.'
          ],
          nextActions: [
            'Launch separate Sports-first and Casino-first creatives with one primary CTA each.',
            'Track FTD and NGR per creative and segment tag.',
            'Calibrate model assumptions with a small paid traffic smoke test.'
          ]
        };
      }

      function render(report) {
        const reportEl = document.getElementById('report');
        const grid = document.getElementById('funnelGrid');
        const insights = document.getElementById('insights');
        const nextActions = document.getElementById('nextActions');

        const rows = [
          ['Impressions', report.funnel.impressions],
          ['Clicks', report.funnel.clicks],
          ['Signups', report.funnel.signups],
          ['FTD', report.funnel.firstTimeDepositors],
          ['NGR (€)', report.funnel.ngrEstimateEur],
          ['CTR', report.funnel.ctr],
          ['Signup/Click', report.funnel.signupRateFromClick],
          ['FTD/Signup', report.funnel.ftdRateFromSignup],
        ];

        grid.innerHTML = rows.map(([k, v]) => `<div class="card"><strong>${k}</strong><br>${v}</div>`).join('');
        insights.innerHTML = report.insights.map((x) => `<li>${x}</li>`).join('');
        nextActions.innerHTML = report.nextActions.map((x) => `<li>${x}</li>`).join('');
        reportEl.hidden = false;
      }

      document.getElementById('simulateBtn').addEventListener('click', () => {
        const text = document.getElementById('banner').value;
        const report = simulate(text, 1000);
        render(report);
      });

      document.getElementById('chatBtn').addEventListener('click', () => {
        const message = document.getElementById('chatInput').value.toLowerCase();
        const text = document.getElementById('banner').value;
        if (message.includes('simulate') || message.includes('test') || message.includes('banner')) {
          const report = simulate(text, 1000);
          render(report);
          document.getElementById('chatReply').textContent = 'Done: simulated 1000 synthetic personas and updated FTD/NGR forecast.';
          return;
        }
        document.getElementById('chatReply').textContent = 'Try: "simulate this banner for 1000 personas".';
      });
    </script>
  </body>
</html>
